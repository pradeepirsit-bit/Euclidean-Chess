<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Euclidean Chess Simulator</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #88ddff;
            padding: 12px 24px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            pointer-events: none;
            z-index: 10;
            font-size: 14px;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        #status {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #ffd700;
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            border: 1px solid #444;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }
        #reset-btn {
            position: absolute;
            top: 80px;
            right: 30px;
            z-index: 20;
            padding: 10px 24px;
            background: #1a1a2e;
            color: white;
            border: 1px solid #4a4a6a;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #reset-btn:hover {
            background: #2a2a4e;
            border-color: #88aaff;
            transform: scale(1.02);
        }
        #error-msg {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 0, 0, 0.9);
            color: #ff5555;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #ff3333;
            text-align: center;
            z-index: 100;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div id="info">⚡ 3D EUCLIDEAN CHESS • Drag to orbit • Click piece to see attack rays</div>
    <div id="status">Your turn (White)</div>
    <button id="reset-btn">↻ New Game</button>
    <div id="error-msg">
        <h3>⚠️ Server Required</h3>
        <p>Please run a local server (e.g., <code>python3 -m http.server 8000</code>) to load this game.</p>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "chess.js": "https://cdn.jsdelivr.net/npm/chess.js@1.0.0/dist/chess.esm.js"
            }
        }
    </script>

    <script type="module">
        // ----- IMPORTS -----
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { Chess } from 'chess.js';

        // Show error if imports fail (catches network issues)
        window.addEventListener('error', (e) => {
            if (e.message.includes('Failed to fetch') || e.message.includes('import')) {
                document.getElementById('error-msg').style.display = 'block';
            }
        });

        // ----- SETUP SCENE -----
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(7, 9, 13);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.target.set(0, 0.5, 0);
        controls.maxPolarAngle = Math.PI / 2.1;
        controls.minDistance = 5;
        controls.maxDistance = 22;

        // ----- LIGHTING -----
        const ambient = new THREE.AmbientLight(0x404070, 0.6);
        scene.add(ambient);

        const sun = new THREE.DirectionalLight(0xffeedd, 2.0);
        sun.position.set(8, 18, 12);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 40;
        sun.shadow.camera.left = -12;
        sun.shadow.camera.right = 12;
        sun.shadow.camera.top = 12;
        sun.shadow.camera.bottom = -12;
        scene.add(sun);

        const fill = new THREE.DirectionalLight(0x8888ff, 0.5);
        fill.position.set(-6, 6, -10);
        scene.add(fill);

        const back = new THREE.PointLight(0x4466ff, 0.3);
        back.position.set(0, 8, -12);
        scene.add(back);

        // ----- GROUND GLOW (for aesthetics) -----
        const glowMat = new THREE.MeshBasicMaterial({ color: 0x2233aa, transparent: true, opacity: 0.08 });
        const glow = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), glowMat);
        glow.rotation.x = -Math.PI / 2;
        glow.position.y = -0.1;
        scene.add(glow);

        // ----- BOARD (8x8 Grid) - FIXED Z-AXIS FLIP -----
        const boardGroup = new THREE.Group();
        const squareSize = 1;
        const offset = 3.5;

        // Shadow plane
        const floorMat = new THREE.ShadowMaterial({ opacity: 0.6 });
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.01;
        floor.receiveShadow = true;
        scene.add(floor);

        for (let r = 0; r < 8; r++) {
            for (let f = 0; f < 8; f++) {
                const color = (r + f) % 2 === 0 ? 0xf0d9b5 : 0xb58863;
                const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.7, metalness: 0.1 });
                const geo = new THREE.BoxGeometry(squareSize * 0.98, 0.12, squareSize * 0.98);
                const square = new THREE.Mesh(geo, mat);
                
                // FIX: r=0 is Rank 8 (top), so Z should be +3.5. r=7 is Rank 1 (bottom), Z = -3.5.
                const zPos = (7 - r) - offset;
                square.position.set(f - offset, -0.06, zPos);
                square.receiveShadow = true;
                square.castShadow = true;
                
                // Store actual chess rank (0 = rank 1, 7 = rank 8)
                const actualRank = (7 - r);
                square.userData = { file: f, rank: actualRank, isSquare: true };
                boardGroup.add(square);
            }
        }
        scene.add(boardGroup);

        // Board border glow
        const borderMat = new THREE.LineBasicMaterial({ color: 0x88aaff, transparent: true, opacity: 0.25 });
        const borderPoints = [
            [-4, 0, -4], [4, 0, -4], [4, 0, 4], [-4, 0, 4], [-4, 0, -4]
        ];
        const borderGeo = new THREE.BufferGeometry().setFromPoints(borderPoints.map(p => new THREE.Vector3(p[0], -0.01, p[2])));
        const borderLine = new THREE.Line(borderGeo, borderMat);
        scene.add(borderLine);

        // ----- PIECE CREATION (Stylized) -----
        function createPiece(type, color) {
            const group = new THREE.Group();
            const isWhite = color === 'w';
            const mainColor = isWhite ? 0xf0f0f0 : 0x1a1a1a;
            const accentColor = isWhite ? 0xcccccc : 0x333333;
            const shine = isWhite ? 0.6 : 0.2;

            const baseMat = new THREE.MeshStandardMaterial({ color: mainColor, roughness: 0.25, metalness: shine });
            const accentMat = new THREE.MeshStandardMaterial({ color: accentColor, roughness: 0.4, metalness: 0.3 });

            const baseGeo = new THREE.CylinderGeometry(0.35, 0.45, 0.15, 16);
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.y = 0.075;
            base.castShadow = true;
            group.add(base);

            if (type === 'p') {
                const body = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16), baseMat);
                body.position.y = 0.3;
                body.castShadow = true;
                group.add(body);
                const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 0.15, 8), baseMat);
                neck.position.y = 0.5;
                neck.castShadow = true;
                group.add(neck);
                const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12), baseMat);
                head.position.y = 0.65;
                head.castShadow = true;
                group.add(head);
            } else if (type === 'n') {
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.35, 0.4, 8), baseMat);
                body.position.y = 0.35;
                body.castShadow = true;
                group.add(body);
                const head = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.25, 0.4), baseMat);
                head.position.set(0, 0.6, 0.1);
                head.castShadow = true;
                group.add(head);
                const ear = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.15, 6), accentMat);
                ear.position.set(0.1, 0.7, 0.25);
                ear.rotation.x = 0.3;
                group.add(ear);
            } else if (type === 'b') {
                const body = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.5, 8), baseMat);
                body.position.y = 0.35;
                body.castShadow = true;
                group.add(body);
                const collar = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.05, 8, 12), accentMat);
                collar.position.y = 0.55;
                collar.rotation.x = Math.PI / 2;
                group.add(collar);
                const head = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8), baseMat);
                head.position.y = 0.7;
                head.castShadow = true;
                group.add(head);
            } else if (type === 'r') {
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.35, 0.5, 12), baseMat);
                body.position.y = 0.35;
                body.castShadow = true;
                group.add(body);
                const top = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.3, 0.1, 12), accentMat);
                top.position.y = 0.6;
                group.add(top);
                const battlement = new THREE.Mesh(new THREE.TorusGeometry(0.32, 0.06, 6, 12), accentMat);
                battlement.position.y = 0.65;
                battlement.rotation.x = Math.PI / 2;
                group.add(battlement);
            } else if (type === 'q') {
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 0.5, 12), baseMat);
                body.position.y = 0.35;
                body.castShadow = true;
                group.add(body);
                const mid = new THREE.Mesh(new THREE.SphereGeometry(0.25, 12), baseMat);
                mid.position.y = 0.6;
                mid.castShadow = true;
                group.add(mid);
                const crown = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.3, 8), accentMat);
                crown.position.y = 0.85;
                crown.castShadow = true;
                group.add(crown);
                for (let i = 0; i < 4; i++) {
                    const spike = new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.15, 4), accentMat);
                    spike.position.set(Math.sin(i * Math.PI/2) * 0.28, 0.7, Math.cos(i * Math.PI/2) * 0.28);
                    spike.rotation.x = Math.PI/2 * (i % 2);
                    group.add(spike);
                }
            } else if (type === 'k') {
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, 0.5, 12), baseMat);
                body.position.y = 0.35;
                body.castShadow = true;
                group.add(body);
                const mid = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 0.2, 8), accentMat);
                mid.position.y = 0.6;
                group.add(mid);
                const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8), baseMat);
                head.position.y = 0.75;
                head.castShadow = true;
                group.add(head);
                const crossH = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.25, 0.08), accentMat);
                crossH.position.y = 0.9;
                group.add(crossH);
                const crossV = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.08, 0.08), accentMat);
                crossV.position.y = 0.9;
                group.add(crossV);
            }
            return group;
        }

        // ----- GAME STATE -----
        const chess = new Chess();
        let selectedSquare = null;
        let legalMovesForSelected = [];
        let currentTurn = 'w';
        let isAnimating = false;
        let moveQueue = [];
        let attackLines = [];

        const pieceMap = new Map();

        // 3D position converter (ACCURATE)
        function squareToPos(square) {
            const file = square.charCodeAt(0) - 97; // 0 to 7
            const rank = parseInt(square[1]) - 1;  // 0 to 7
            return new THREE.Vector3(file - 3.5, 0.5, rank - 3.5);
        }

        function posToSquare(pos) {
            const file = Math.round(pos.x + 3.5);
            const rank = Math.round(pos.z + 3.5);
            if (file < 0 || file > 7 || rank < 0 || rank > 7) return null;
            return String.fromCharCode(97 + file) + (rank + 1);
        }

        // ----- RENDER PIECES FROM FEN -----
        function renderBoard() {
            for (const [sq, data] of pieceMap) {
                scene.remove(data.group);
            }
            pieceMap.clear();

            const board = chess.board();
            for (let r = 0; r < 8; r++) {
                for (let f = 0; f < 8; f++) {
                    const piece = board[r][f];
                    if (piece) {
                        // r=0 is rank 8
                        const square = String.fromCharCode(97 + f) + (8 - r);
                        const group = createPiece(piece.type, piece.color);
                        const pos = squareToPos(square);
                        group.position.copy(pos);
                        group.userData.targetPos = pos.clone();
                        group.userData.currentPos = pos.clone();
                        group.userData.square = square;
                        group.userData.isPiece = true;
                        scene.add(group);
                        pieceMap.set(square, { group, type: piece.type, color: piece.color });
                    }
                }
            }
        }

        // ----- SMOOTH EUCLIDEAN ANIMATION LOOP -----
        function animatePieces(delta) {
            const speed = 9.0;
            for (const [sq, data] of pieceMap) {
                const group = data.group;
                const target = group.userData.targetPos;
                const current = group.userData.currentPos;
                if (!current.equals(target)) {
                    const diff = new THREE.Vector3().copy(target).sub(current);
                    const dist = diff.length();
                    if (dist < 0.008) {
                        current.copy(target);
                    } else {
                        const step = Math.min(speed * delta, dist);
                        current.add(diff.normalize().multiplyScalar(step));
                    }
                    group.position.copy(current);
                }
            }
        }

        // ----- MOVE EXECUTION -----
        function executeMove(move) {
            if (!move) return false;
            const result = chess.move(move);
            if (!result) return false;

            const from = result.from;
            const to = result.to;
            const captured = result.captured;

            // Remove captured piece
            if (captured) {
                if (pieceMap.has(to)) {
                    const data = pieceMap.get(to);
                    scene.remove(data.group);
                    pieceMap.delete(to);
                }
                // En passant capture
                if (result.flags === 'e') {
                    const epSquare = result.epSquare;
                    if (epSquare && pieceMap.has(epSquare)) {
                        const data = pieceMap.get(epSquare);
                        scene.remove(data.group);
                        pieceMap.delete(epSquare);
                    }
                }
            }

            // Move piece from 'from' to 'to'
            if (pieceMap.has(from)) {
                const data = pieceMap.get(from);
                const group = data.group;
                pieceMap.delete(from);
                pieceMap.set(to, data);
                group.userData.square = to;
                const targetPos = squareToPos(to);
                group.userData.targetPos.copy(targetPos);
                
                if (result.promotion) {
                    data.type = result.promotion;
                    // For visual simplicity, we keep the old mesh, but we could recreate it.
                }

                // Castling rook movement
                if (result.flags === 'k' || result.flags === 'q') {
                    const rookFrom = result.flags === 'k' ? 'h' + result.from[1] : 'a' + result.from[1];
                    const rookTo = result.flags === 'k' ? 'f' + result.from[1] : 'd' + result.from[1];
                    if (pieceMap.has(rookFrom)) {
                        const rookData = pieceMap.get(rookFrom);
                        const rookGroup = rookData.group;
                        pieceMap.delete(rookFrom);
                        pieceMap.set(rookTo, rookData);
                        rookGroup.userData.square = rookTo;
                        rookGroup.userData.targetPos.copy(squareToPos(rookTo));
                    }
                }
            }

            clearAttackLines();
            selectedSquare = null;
            legalMovesForSelected = [];

            currentTurn = chess.turn();
            if (chess.isGameOver()) {
                let msg = 'Game Over! ';
                if (chess.isCheckmate()) msg += (chess.turn() === 'w' ? 'Black' : 'White') + ' wins by checkmate!';
                else if (chess.isDraw()) msg += 'Draw!';
                document.getElementById('status').innerHTML = msg;
                document.getElementById('status').style.color = '#ff6b6b';
            } else {
                document.getElementById('status').style.color = '#ffd700';
                document.getElementById('status').innerHTML = (chess.turn() === 'w' ? "White's" : "Black's") + ' turn';
            }
            return true;
        }

        // ----- AI MOVE (Random) -----
        function makeAIMove() {
            if (isAnimating) return;
            if (chess.isGameOver()) return;
            if (chess.turn() !== 'b') return;

            const moves = chess.moves({ verbose: true });
            if (moves.length === 0) return;

            const move = moves[Math.floor(Math.random() * moves.length)];
            isAnimating = true;
            executeMove(move);
            setTimeout(() => { isAnimating = false; }, 300);
        }

        // ----- RAYCASTER INTERACTION -----
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        function getIntersects(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            const meshes = [];
            scene.traverse((child) => {
                if (child.isMesh) meshes.push(child);
            });
            return raycaster.intersectObjects(meshes, false);
        }

        function handleClick(event) {
            if (isAnimating) return;
            if (chess.isGameOver()) return;
            if (chess.turn() !== 'w') return;

            const intersects = getIntersects(event);
            if (intersects.length === 0) return;

            const hit = intersects[0].object;
            let pieceGroup = null;
            let clickedSquare = null;

            let parent = hit;
            while (parent) {
                if (parent.userData && parent.userData.isPiece) {
                    pieceGroup = parent;
                    clickedSquare = pieceGroup.userData.square;
                    break;
                }
                if (parent.userData && parent.userData.isSquare) {
                    const f = parent.userData.file;
                    const r = parent.userData.rank; // now correctly 0=rank1, 7=rank8
                    clickedSquare = String.fromCharCode(97 + f) + (r + 1);
                    break;
                }
                parent = parent.parent;
            }

            if (!clickedSquare) return;

            // If a piece is selected and we click a legal target
            if (selectedSquare) {
                const move = legalMovesForSelected.find(m => m.to === clickedSquare);
                if (move) {
                    isAnimating = true;
                    executeMove(move);
                    setTimeout(() => {
                        isAnimating = false;
                        if (!chess.isGameOver() && chess.turn() === 'b') {
                            setTimeout(makeAIMove, 350);
                        }
                    }, 300);
                    return;
                }
            }

            // Try to select a new piece
            if (pieceGroup) {
                const sq = pieceGroup.userData.square;
                const piece = chess.get(sq);
                if (piece && piece.color === chess.turn()) {
                    clearAttackLines();
                    selectedSquare = sq;
                    const moves = chess.moves({ square: sq, verbose: true });
                    legalMovesForSelected = moves;
                    drawAttackLines(sq, moves);
                    return;
                }
            }

            // Clicked empty or invalid
            clearAttackLines();
            selectedSquare = null;
            legalMovesForSelected = [];
        }

        // ----- DRAW EUCLIDEAN ATTACK RAYS -----
        function drawAttackLines(square, moves) {
            clearAttackLines();
            const fromPos = squareToPos(square);
            const lineMat = new THREE.LineBasicMaterial({ color: 0xff4466, transparent: true, opacity: 0.7 });

            for (const move of moves) {
                const toPos = squareToPos(move.to);
                const points = [
                    new THREE.Vector3(fromPos.x, 0.55, fromPos.z),
                    new THREE.Vector3(toPos.x, 0.55, toPos.z)
                ];
                const geo = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(geo, lineMat);
                scene.add(line);
                attackLines.push(line);

                // Target indicator
                const sphereMat = new THREE.MeshBasicMaterial({ color: 0x33ff88 });
                const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.1, 6), sphereMat);
                sphere.position.set(toPos.x, 0.55, toPos.z);
                scene.add(sphere);
                attackLines.push(sphere);
            }
        }

        function clearAttackLines() {
            for (const obj of attackLines) {
                scene.remove(obj);
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) obj.material.dispose();
            }
            attackLines = [];
        }

        // ----- RESET -----
        function resetGame() {
            chess.reset();
            clearAttackLines();
            selectedSquare = null;
            legalMovesForSelected = [];
            currentTurn = 'w';
            isAnimating = false;
            renderBoard();
            document.getElementById('status').innerHTML = "Your turn (White)";
            document.getElementById('status').style.color = '#ffd700';
        }

        // ----- EVENT LISTENERS -----
        renderer.domElement.addEventListener('click', handleClick);
        document.getElementById('reset-btn').addEventListener('click', resetGame);
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ----- INIT -----
        resetGame();

        // ----- RENDER LOOP -----
        const clock = new THREE.Clock();

        function animate() {
            const delta = Math.min(clock.getDelta(), 0.05);
            animatePieces(delta);
            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        console.log('✅ 3D Euclidean Chess loaded. Click a white piece to see Euclidean attack vectors.');
    </script>
</body>
</html>
